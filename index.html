<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="在瀏覽器中框選並修復固定位置影片浮水印。">
  <title>影片去浮水印大師</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">跳到主要內容</a>
  <header class="masthead">
    <div class="masthead-copy">
      <p class="service-note">AI VIDEO RESTORATION WORKSPACE</p>
      <h1>影片去浮水印大師</h1>
      <p>上傳一分鐘內的影片，確認固定浮水印位置，完成後直接下載。</p>
    </div>
    <p class="app-status"><span aria-hidden="true"></span>系統就緒</p>
  </header>

  <main id="main">
    <nav class="workflow-progress" aria-label="影片處理步驟">
      <span class="is-current" data-workflow-step="1" aria-current="step">01 上傳影片</span>
      <span data-workflow-step="2">02 確認範圍</span>
      <span data-workflow-step="3">03 處理中</span>
      <span data-workflow-step="4">04 完成</span>
    </nav>

    <section class="workflow-card" id="upload-step" aria-labelledby="upload-heading">
      <div class="section-heading">
        <span class="step" aria-hidden="true">01</span>
        <div>
          <h2 id="upload-heading">上傳影片</h2>
          <p>先選擇要處理的來源影片。</p>
        </div>
      </div>
      <label class="dropzone" id="dropzone" for="file-input">
        <input id="file-input" type="file" accept=".mp4,.mov,.avi,video/mp4,video/quicktime">
        <strong>拖曳影片到這裡，或點一下選擇檔案</strong>
        <small>MP4／MOV／AVI・60 秒內・1080p・200 MB</small>
      </label>
    </section>

    <section class="workflow-card is-hidden" id="edit-step" aria-labelledby="edit-heading">
      <div class="section-heading">
        <span class="step" aria-hidden="true">02</span>
        <div>
          <h2 id="edit-heading">確認浮水印範圍</h2>
          <p id="video-meta"></p>
        </div>
      </div>
      <div class="editor-workspace">
        <div class="editor-primary">
          <p class="editor-help">點選範圍後可拖曳移動；拖曳右下角可調整大小。</p>
          <div class="editor-shell">
            <canvas id="editor" aria-label="浮水印範圍編輯畫布"></canvas>
          </div>
        </div>
        <aside class="editor-controls" aria-label="範圍操作">
          <div class="toolbar" role="group" aria-label="範圍編輯工具">
            <button id="detect-button" type="button">自動偵測</button>
            <button id="add-button" type="button" class="secondary">新增範圍</button>
            <button id="delete-button" type="button" class="secondary">刪除所選範圍</button>
          </div>
          <div id="box-fields" class="box-fields"></div>
          <label class="consent">
            <input id="rights" type="checkbox">
            <span>我確認擁有或已獲授權處理這段影片</span>
          </label>
          <button id="process-button" type="button" disabled>開始處理</button>
        </aside>
      </div>
    </section>

    <section class="workflow-card is-hidden" id="progress-step" aria-labelledby="progress-heading">
      <div class="section-heading">
        <span class="step" aria-hidden="true">03</span>
        <div>
          <h2 id="progress-heading">正在處理</h2>
          <p id="live-status" aria-live="polite">準備中</p>
        </div>
      </div>
      <progress id="progress" max="100" value="0">0%</progress>
      <button id="progress-reset-button" type="button" class="secondary progress-reset">取消並重新開始</button>
    </section>

    <section class="workflow-card is-hidden" id="result-step" aria-labelledby="result-heading">
      <div class="section-heading">
        <span class="step" aria-hidden="true">04</span>
        <div>
          <h2 id="result-heading">處理完成</h2>
          <p>請先預覽結果，確認後再下載檔案。</p>
        </div>
      </div>
      <video id="result-video" controls playsinline></video>
      <div class="result-actions">
        <a id="download-button" class="button" download="watermark-removed.mp4">下載修復影片</a>
        <button id="reset-button" type="button" class="secondary">處理另一支影片</button>
      </div>
    </section>

    <aside class="notice" aria-labelledby="notice-heading">
      <h2 id="notice-heading">使用前請留意</h2>
      <p>修復畫面是依周圍影像推測補畫，不代表能還原被遮住的原始內容。本工具僅供處理你擁有或已獲授權的影片。</p>
    </aside>
  </main>
  <div id="toast" role="alert" aria-live="assertive"></div>
</body>
</html>
